<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BillboardX Management System</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-dark: #0F172A;
            --surface: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            background-color: #F8FAFC;
            color: var(--text-main);
        }

        /* Split Screen Container */
        .page-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Hero Banner */
        .hero-section {
            flex: 1;
            background: linear-gradient(135deg, #1E1B4B 0%, #312E81 50%, #4338CA 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }

        /* Decorative Grid Effect for Billboard Theme */
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo span {
            color: #818CF8;
        }

        .hero-content {
            max-width: 480px;
            z-index: 1;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .hero-subtitle {
            color: #C7D2FE;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .hero-footer {
            font-size: 0.875rem;
            color: #A5B4FC;
            z-index: 1;
        }

        /* Right Form Section */
        .form-section {
            width: 500px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 2.5rem;
        }

        .form-wrapper {
            width: 100%;
            max-width: 360px;
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .input-control {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: all 0.2s ease;
            background-color: #F8FAFC;
        }

        .input-control:focus {
            border-color: var(--primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            .hero-section {
                display: none;
            }
            .form-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- Left Visual Side -->
        <div class="hero-section">
            <div class="brand-logo">
                Billboard<span>Hub</span>
            </div>
            <div class="hero-content">
                <h2 class="hero-title">Manage your outdoor ad inventory effortlessly.</h2>
                <p class="hero-subtitle">Real-time tracking, scheduling, and analytics for all your physical and digital billboards in one place.</p>
            </div>
            <div class="hero-footer">
                &copy; 2026 BillboardX System. All rights reserved.
            </div>
        </div>

        <!-- Right Form Side -->
        <div class="form-section">
            <div class="form-wrapper">
                <div class="form-header">
                    <h1>Welcome back</h1>
                    <p>Please enter your credentials to access the portal.</p>
                </div>

                <form action="LoginActionControl.jsp" method="post" name="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="input-control" placeholder="Enter your username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="input-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-submit">Sign In</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
